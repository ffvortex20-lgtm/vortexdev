<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VORTEX | Admin Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-box { background: var(--card); border: 1px solid #222; padding: 30px; border-radius: 20px; width: 100%; max-width: 650px; box-shadow: 0 0 40px rgba(0,162,255,0.1); }
        .prod-input { background: #000; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; border-left: 4px solid var(--blue); }
        label { font-size: 10px; color: var(--blue); text-transform: uppercase; display: block; margin-top: 15px; font-weight: 900; }
        input { width: 100%; padding: 12px; margin: 5px 0; background: #0a0a0a; border: 1px solid #222; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        .btn-add { background: none; color: var(--blue); border: 2px dashed var(--blue); width: 100%; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        .btn-gen { background: var(--blue); color: white; border: none; width: 100%; padding: 20px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 16px; text-transform: uppercase; }
        #output-area { margin-top: 30px; display: none; width: 100%; max-width: 650px; }
        textarea { width: 100%; height: 70px; background: #000; color: #25D366; border: 1px dashed #25D366; padding: 10px; border-radius: 10px; resize: none; font-size: 11px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h1 style="text-align:center; margin-bottom:30px;">VORTEX <span>CREATOR</span></h1>
    <div id="container-produtos"></div>
    <button class="btn-add" onclick="addProd()">+ NOVO PRODUTO</button>
    <button class="btn-gen" onclick="generateSystem()">GERAR HUB COMPLETO</button>
</div>

<div id="output-area">
    <label>Link Gerado:</label>
    <textarea id="finalUrl" readonly></textarea>
    <button class="btn-gen" style="background:#222; margin-top:10px; font-size:13px;" onclick="copyLink()">COPIAR LINK</button>
</div>

<script>
    const popSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3');
    function playPop() { popSfx.currentTime = 0; popSfx.play(); }

    let count = 0;
    function addProd() {
        playPop();
        if(count >= 15) return;
        count++;
        const div = document.createElement('div');
        div.className = 'prod-input';
        div.innerHTML = `
            <b style="color:#fff;">PRODUTO #${count}</b>
            <label>Nome</label><input type="text" class="pName">
            <label>Mídia (Link Foto / YouTube / Pinterest)</label><input type="text" class="pMediaLink">
            <label>Link Download</label><input type="text" class="pLink">
            <label>YouTube</label><input type="text" class="pYT">
            <label>WhatsApp</label><input type="text" class="pWA">
        `;
        document.getElementById('container-produtos').appendChild(div);
    }

    async function generateSystem() {
        playPop();
        const n = Array.from(document.querySelectorAll('.pName')).map(i => i.value).join('|');
        const l = Array.from(document.querySelectorAll('.pLink')).map(i => i.value).join('|');
        const yt = Array.from(document.querySelectorAll('.pYT')).map(i => i.value).join('|');
        const wa = Array.from(document.querySelectorAll('.pWA')).map(i => i.value).join('|');
        const media = Array.from(document.querySelectorAll('.pMediaLink')).map(i => i.value).join('|');

        let loc = window.location.href;
        let targetPage = loc.substring(0, loc.lastIndexOf("/")) + "/v.html";
        const fullUrl = `${targetPage}?n=${encodeURIComponent(n)}&l=${encodeURIComponent(l)}&i=${encodeURIComponent(media)}&yt=${encodeURIComponent(yt)}&wa=${encodeURIComponent(wa)}`;

        try {
            const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(fullUrl)}`);
            const short = await res.text();
            document.getElementById('finalUrl').value = (short.includes("Error")) ? fullUrl : short;
            document.getElementById('output-area').style.display = 'block';
        } catch(e) { document.getElementById('finalUrl').value = fullUrl; }
    }

    function copyLink() { playPop(); document.getElementById('finalUrl').select(); document.execCommand('copy'); alert("Copiado!"); }
    addProd();
</script>
</body>
</html>
