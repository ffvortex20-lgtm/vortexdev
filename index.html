<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VORTEX | Painel Gerador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { background: var(--card); border: 1px solid #222; padding: 30px; border-radius: 20px; width: 400px; box-shadow: 0 0 30px rgba(0,162,255,0.1); }
        h2 span { color: var(--blue); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-gen { background: var(--blue); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        textarea { width: 100%; height: 80px; background: #000; color: var(--blue); border: 1px dashed #444; padding: 10px; margin-top: 20px; border-radius: 5px; resize: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>VORTEX <span>GERADOR</span></h2>
    <input type="text" id="pName" placeholder="Nome do Produto">
    <input type="text" id="pImg" placeholder="Link da Imagem (URL)">
    <input type="text" id="pUrl" placeholder="Link de Download Real">
    <button class="btn-gen" onclick="gerar()">GERAR LINK DE BLOQUEIO</button>
    <textarea id="output" readonly placeholder="O link aparecerá aqui..."></textarea>
</div>

<script>
    function gerar() {
        const n = encodeURIComponent(document.getElementById('pName').value);
        const i = encodeURIComponent(document.getElementById('pImg').value);
        const u = encodeURIComponent(document.getElementById('pUrl').value);
        
        // Pega o endereço atual e troca index.html por v.html
        let base = window.location.href.split('?')[0];
        base = base.replace('index.html', 'v.html');
        if(!base.includes('v.html')) base += 'v.html';

        const final = `${base}?n=${n}&i=${i}&url=${u}`;
        document.getElementById('output').value = final;
    }
</script>
</body>
</html>
