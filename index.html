<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Clone - Custom</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">VELOCITY<span>.</span></div>
        <div class="nav-links" id="tabs-container">
            </div>
        <button class="btn-discord">Discord</button>
    </nav>

    <main class="hero">
        <h1 id="hero-title">Made with precision</h1>
        <p id="hero-subtitle">Unmatched power and stability through cutting-edge game enhancement tools.</p>
        <div class="actions">
            <button class="btn-primary" onclick="scrollToProducts()">View Products</button>
        </div>
    </main>

    <section class="products" id="products-section">
        <h2 id="section-title">Products</h2>
        <div class="products-grid" id="products-grid">
            </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
