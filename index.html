<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | Precision Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050505;
            --bg-card: rgba(18, 18, 18, 0.8);
            --accent-blue: #00a2ff;
            --text-main: #ffffff;
            --text-dim: #888888;
            --glow: 0 0 20px rgba(0, 162, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at top center, #0a1a2f 0%, #050505 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 8%;
            backdrop-filter: blur(10px);
        }

        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; }
        .logo span { color: var(--accent-blue); text-shadow: var(--glow); }

        .tabs {
            background: rgba(255, 255, 255, 0.05);
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* --- HERO --- */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 15px; }
        .hero p { color: var(--text-dim); font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px; }

        /* --- GRID DE PRODUTOS --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-5px);
            box-shadow: var(--glow);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .card h3 { margin-bottom: 10px; font-size: 1.3rem; }
        .card p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 25px; height: 40px; }

        .btn-download {
            background: #fff;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-download:hover {
            background: var(--accent-blue);
            color: #fff;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent-blue);
            width: 40px; height: 40px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">VELO<span>CITY</span></div>
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" onclick="filterTab('Software')">Software</button>
            <button class="tab-btn" onclick="filterTab('Tools')">Tools</button>
            <button class="tab-btn" onclick="filterTab('Scripts')">Scripts</button>
        </div>
        <button class="btn-download" style="width: auto; padding: 10px 20px;">Discord</button>
    </nav>

    <div class="hero">
        <h1>Made with precision</h1>
        <p>Unmatched power and stability through cutting-edge game enhancement tools.</p>
    </div>

    <div class="container">
        <div class="products-grid" id="productGrid">
            </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p id="statusText">Generating secure link...</p>
    </div>

    <script>
        // --- CONFIGURAÇÃO DOS PRODUTOS ---
        const products = [
            { name: "Roblox External", category: "Software", desc: "Melhor performance para Windows.", img: "https://r2.e-z.host/2427a147-3622-4217-9f79-11f8e13783c5/r8x1u26l.png", url: "https://link-do-seu-arquivo.com/roblox" },
            { name: "CS2 Internal", category: "Software", desc: "Aimbot & ESP de alta precisão.", img: "https://r2.e-z.host/2427a147-3622-4217-9f79-11f8e13783c5/k2z9t1j2.png", url: "https://link-do-seu-arquivo.com/cs2" },
            { name: "Universal Spoofer", category: "Tools", desc: "Bypass HWID bans instantaneamente.", img: "https://r2.e-z.host/2427a147-3622-4217-9f79-11f8e13783c5/3l0p9v8n.png", url: "https://link-do-seu-arquivo.com/spoofer" }
        ];

        function renderProducts(cat) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            const filtered = products.filter(p => p.category === cat);
            
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <button class="btn-download" onclick="handleDownload('${p.url}')">Download</button>
                    </div>
                `;
            });
        }

        async function handleDownload(originalUrl) {
            const loader = document.getElementById('loading');
            loader.style.display = 'flex';

            try {
                // Integração com TinyURL (O "TinyURL" que você pediu)
                const api = `https://tinyurl.com/api-create.php?url=${encodeURIComponent(originalUrl)}`;
                const response = await fetch(api);
                const shortUrl = await response.text();

                // Simulando o delay de "Unlock" do Rekonise
                setTimeout(() => {
                    window.location.href = shortUrl;
                }, 2000);

            } catch (error) {
                window.location.href = originalUrl;
            }
        }

        function filterTab(cat) {
            // Atualiza botões
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            renderProducts(cat);
        }

        // Inicializar
        renderProducts('Software');
    </script>
</body>
</html>
