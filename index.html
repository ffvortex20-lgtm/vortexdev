<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VORTEX | Admin Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-box { background: var(--card); border: 1px solid #222; padding: 35px; border-radius: 20px; width: 420px; box-shadow: 0 0 30px rgba(0,162,255,0.1); }
        h2 span { color: var(--blue); }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; margin: 10px 0; outline: none; }
        .btn-gen { background: var(--blue); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        #output-area { margin-top: 20px; display: none; }
        textarea { width: 100%; height: 60px; background: #000; color: #25D366; border: 1px dashed #25D366; padding: 10px; border-radius: 5px; resize: none; font-size: 12px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>VORTEX <span>HUB</span></h2>
    <input type="text" id="pName" placeholder="Nome do Executor/Cheat">
    <input type="text" id="pImg" placeholder="URL da Imagem (Thumbnail)">
    <input type="text" id="pUrl" placeholder="Link de Download Real">
    
    <button class="btn-gen" onclick="gerarLink()">GERAR LINK CURTO VELOCITY</button>

    <div id="output-area">
        <label style="font-size:11px; color:#888;">Link Encurtado (TinyURL):</label>
        <textarea id="output" readonly></textarea>
        <button class="btn-gen" style="background:#222;" onclick="copy()">COPIAR LINK</button>
    </div>
</div>

<script>
    async function gerarLink() {
        const n = encodeURIComponent(document.getElementById('pName').value);
        const i = encodeURIComponent(document.getElementById('pImg').value);
        const u = encodeURIComponent(document.getElementById('pUrl').value);
        
        // Monta o link longo da página v.html
        let base = window.location.href.replace('index.html', 'v.html');
        if(!base.includes('v.html')) base += 'v.html';
        const linkLongo = `${base}?n=${n}&i=${i}&url=${u}`;

        // Encurta via TinyURL API
        try {
            const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(linkLongo)}`);
            const linkCurto = await res.text();
            document.getElementById('output').value = linkCurto;
            document.getElementById('output-area').style.display = 'block';
        } catch(e) { alert("Erro na API TinyURL"); }
    }
    function copy() { document.getElementById('output').select(); document.execCommand('copy'); alert("Copiado!"); }
</script>
</body>
</html>
