<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VORTEX | Admin Hub 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-box { background: var(--card); border: 1px solid #222; padding: 30px; border-radius: 20px; width: 100%; max-width: 600px; box-shadow: 0 0 30px rgba(0,162,255,0.1); }
        .prod-input { background: #000; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
        label { font-size: 10px; color: var(--blue); text-transform: uppercase; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #111; border: 1px solid #222; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-add { background: none; color: var(--blue); border: 2px dashed var(--blue); width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        .btn-gen { background: var(--blue); color: white; border: none; width: 100%; padding: 18px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-gen:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--blue); }
        #output-area { margin-top: 25px; display: none; width: 100%; max-width: 600px; }
        textarea { width: 100%; height: 60px; background: #000; color: #25D366; border: 1px dashed #25D366; padding: 10px; border-radius: 8px; resize: none; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2 style="text-align:center; margin-bottom:20px;">VORTEX <span>STUDIO</span></h2>
    <div id="lista-produtos"></div>
    <button class="btn-add" onclick="novoProduto()">+ ADICIONAR PRODUTO (Máx 15)</button>
    <button class="btn-gen" onclick="gerarTudo()">GERAR PÁGINA VELOCITY</button>
</div>

<div id="output-area">
    <label>LINK ENCURTADO PARA DIVULGAR:</label>
    <textarea id="resLink" readonly></textarea>
    <button class="btn-gen" style="background:#222; margin-top:10px; font-size:12px; padding:10px;" onclick="copy()">COPIAR LINK</button>
</div>

<script>
    let qtd = 0;
    function novoProduto() {
        if(qtd >= 15) return alert("Limite de 15 atingido!");
        qtd++;
        const div = document.createElement('div');
        div.className = 'prod-input';
        div.innerHTML = `
            <b style="color:white">PRODUTO #${qtd}</b>
            <label>Nome do Arquivo</label>
            <input type="text" class="pNome" placeholder="Ex: Fluxus V2">
            <label>Link da Imagem (URL)</label>
            <input type="text" class="pImg" placeholder="Link da foto no Imgur/Discord">
            <label>Link de Download Final</label>
            <input type="text" class="pLink" placeholder="Link do Mediafire/Mega">
            <label>Link do Canal/Vídeo (YouTube)</label>
            <input type="text" class="pYT" placeholder="URL do seu canal">
            <label>Link do Grupo/Canal (WhatsApp)</label>
            <input type="text" class="pWA" placeholder="URL do seu WhatsApp">
        `;
        document.getElementById('lista-produtos').appendChild(div);
    }

    async function gerarTudo() {
        const n = Array.from(document.querySelectorAll('.pNome')).map(i => i.value).join('|');
        const l = Array.from(document.querySelectorAll('.pLink')).map(i => i.value).join('|');
        const i = Array.from(document.querySelectorAll('.pImg')).map(i => i.value).join('|');
        const yt = Array.from(document.querySelectorAll('.pYT')).map(i => i.value).join('|');
        const wa = Array.from(document.querySelectorAll('.pWA')).map(i => i.value).join('|');

        let base = window.location.href.replace('index.html', 'v.html');
        if(!base.includes('v.html')) base += 'v.html';
        
        // Agora os links sociais também vão na URL
        const longUrl = `${base}?n=${encodeURIComponent(n)}&l=${encodeURIComponent(l)}&i=${encodeURIComponent(i)}&yt=${encodeURIComponent(yt)}&wa=${encodeURIComponent(wa)}`;

        const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
        const short = await res.text();
        document.getElementById('resLink').value = short;
        document.getElementById('output-area').style.display = 'block';
    }

    function copy() { document.getElementById('resLink').select(); document.execCommand('copy'); alert("Link Copiado!"); }
    novoProduto();
</script>
</body>
</html>
