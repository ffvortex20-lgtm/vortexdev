<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VORTEX | Gerenciador de Produtos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #111; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; padding: 40px; }
        .admin-container { max-width: 800px; margin: auto; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #222; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input { background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--blue); }
        .btn-add { background: var(--blue); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        
        /* Preview dos Cards */
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card-preview { background: #0c0c0c; border: 1px solid #1a1a1a; border-radius: 15px; padding: 15px; text-align: center; position: relative; }
        .card-preview img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .card-preview h3 { font-size: 14px; margin: 10px 0; }
        .btn-copy { background: #222; color: #888; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2 style="text-align:center; margin-bottom:25px;">VORTEX <span>DASHBOARD</span></h2>
    <div class="input-group">
        <input type="text" id="inName" placeholder="Nome (Ex: Velocity Roblox Windows)">
        <input type="text" id="inImg" placeholder="Link da Imagem">
        <input type="text" id="inUrl" placeholder="Link de Download">
        <input type="text" id="inDesc" placeholder="Pequena descrição">
    </div>
    <button class="btn-add" onclick="adicionarProduto()">ADICIONAR E GERAR LINK</button>

    <div class="preview-grid" id="listaProdutos">
        </div>
</div>

<script>
    async function adicionarProduto() {
        const n = document.getElementById('inName').value;
        const i = document.getElementById('inImg').value;
        const u = document.getElementById('inUrl').value;
        const d = document.getElementById('inDesc').value;

        if(!n || !u) return alert("Preencha Nome e Link!");

        // Criar Link da v.html
        let base = window.location.href.replace('index.html', 'v.html');
        if(!base.includes('v.html')) base += 'v.html';
        const linkLongo = `${base}?n=${encodeURIComponent(n)}&i=${encodeURIComponent(i)}&url=${encodeURIComponent(u)}&d=${encodeURIComponent(d)}`;

        // Encurtar
        const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(linkLongo)}`);
        const linkCurto = await res.text();

        // Adicionar na visualização
        const grid = document.getElementById('listaProdutos');
        grid.innerHTML += `
            <div class="card-preview">
                <img src="${i}">
                <h3>${n}</h3>
                <button class="btn-copy" onclick="navigator.clipboard.writeText('${linkCurto}'); alert('Link Copiado!')">COPIAR LINK ENCURTADO</button>
            </div>
        `;
    }
</script>
</body>
</html>
