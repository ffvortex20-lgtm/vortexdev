<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Velocity | Access Point</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #0c0c0c; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: white; background-image: radial-gradient(circle at top, #0a1a2f 0%, #050505 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .velocity-card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 24px; width: 100%; max-width: 420px; padding: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); border-top: 2px solid var(--blue); }

        .tabs { display: flex; background: #111; padding: 5px; border-radius: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: none; border: none; color: #555; padding: 10px; cursor: pointer; font-weight: 700; font-size: 11px; border-radius: 8px; text-transform: uppercase; }
        .tab-btn.active { background: #1a1a1a; color: var(--blue); }

        /* Lista de Produtos */
        .prod-item { background: #151515; border: 1px solid #222; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .prod-item:hover { border-color: var(--blue); transform: scale(1.02); }
        .btn-open { background: var(--blue); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 900; cursor: pointer; font-size: 10px; }

        /* Modal de Bloqueio */
        #lock-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 100; justify-content: center; align-items: center; }
        .lock-content { background: #0c0c0c; padding: 30px; border-radius: 20px; border: 1px solid #222; width: 350px; text-align: center; border-top: 2px solid var(--blue); }
        .social-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; text-decoration: none; color: white; font-weight: bold; background: #111; border: 1px solid #222; }
        .social-btn.done { border-color: #25D366; color: #25D366; }
        .btn-dl { width: 100%; padding: 18px; border-radius: 10px; border: none; background: #222; color: #555; font-weight: 900; cursor: not-allowed; margin-top: 10px; }
        .btn-dl.ready { background: #fff; color: #000; cursor: pointer; }
    </style>
</head>
<body>

<div class="velocity-card">
    <div class="tabs">
        <button class="tab-btn active" id="tab-p">Products</button>
        <button class="tab-btn">Information</button>
    </div>

    <div id="product-list">
        </div>
</div>

<div id="lock-screen">
    <div class="lock-content">
        <h2 id="lockName" style="margin-bottom:20px; font-size:1.2rem;">Nome do Arquivo</h2>
        <a href="http://www.youtube.com/@Vortex-Ofc1" target="_blank" class="social-btn" id="yt" onclick="validar('yt')">SUBSCRIBE ON YOUTUBE</a>
        <a href="https://whatsapp.com/channel/0029VbC7FWcJENxsIOsndS15" target="_blank" class="social-btn" id="wa" onclick="validar('wa')">JOIN WHATSAPP CHANNEL</a>
        
        <div id="timer" style="display:none; color:var(--blue); margin:10px;">Wait <span id="sec">10</span>s...</div>
        
        <button id="finalBtn" class="btn-dl" disabled onclick="baixar()">DOWNLOAD NOW</button>
        <button onclick="document.getElementById('lock-screen').style.display='none'" style="background:none; border:none; color:#444; margin-top:15px; cursor:pointer;">Fechar</button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const names = params.get('names').split('|');
    const urls = params.get('urls').split('|');
    let currentUrl = "";

    const list = document.getElementById('product-list');
    names.forEach((name, index) => {
        if(name) {
            list.innerHTML += `
                <div class="prod-item">
                    <span style="font-weight:700; font-size:14px;">${name}</span>
                    <button class="btn-open" onclick="openLock('${name}', '${urls[index]}')">DOWNLOAD</button>
                </div>
            `;
        }
    });

    let checks = { yt: false, wa: false };

    function openLock(name, url) {
        currentUrl = url;
        document.getElementById('lockName').innerText = name;
        document.getElementById('lock-screen').style.display = 'flex';
        // Reset
        checks = { yt: false, wa: false };
        document.getElementById('yt').className = 'social-btn';
        document.getElementById('wa').className = 'social-btn';
        document.getElementById('finalBtn').className = 'btn-dl';
        document.getElementById('finalBtn').disabled = true;
    }

    function validar(type) {
        checks[type] = true;
        document.getElementById(type).classList.add('done');
        if(checks.yt && checks.wa) {
            let s = 10;
            document.getElementById('timer').style.display = 'block';
            const count = setInterval(() => {
                s--; document.getElementById('sec').innerText = s;
                if(s <= 0) {
                    clearInterval(count);
                    document.getElementById('timer').style.display = 'none';
                    const b = document.getElementById('finalBtn');
                    b.disabled = false; b.classList.add('ready');
                }
            }, 1000);
        }
    }

    function baixar() { window.location.href = currentUrl; }
</script>
</body>
</html>
