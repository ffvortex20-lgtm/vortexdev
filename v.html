<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>VORTEX | Unlocker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --blue: #00a2ff; --card: #111; --wa: #25D366; --yt: #ff0000; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: white; background-image: radial-gradient(circle at top, #0a1a2f 0%, #050505 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        nav { width: 100%; display: flex; justify-content: space-between; padding: 20px 8%; align-items: center; }
        .logo span { color: var(--blue); text-shadow: 0 0 10px var(--blue); }

        .container { max-width: 400px; width: 90%; margin: 40px auto; }
        .velocity-card { background: var(--card); border: 1px solid #222; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 0 30px rgba(0, 162, 255, 0.1); }
        .preview-img { width: 100%; height: 180px; border-radius: 12px; object-fit: cover; margin-bottom: 15px; border: 1px solid #333; }

        /* Estilo Botões de Bloqueio */
        .step-btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; color: white; text-decoration: none; }
        .yt-btn { background: var(--yt); }
        .wa-btn { background: var(--wa); }
        .step-btn.done { background: #333; opacity: 0.6; pointer-events: none; }
        .step-btn.done::after { content: " ✅"; }

        .btn-main { background: #fff; color: #000; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: 900; cursor: not-allowed; opacity: 0.3; margin-top: 20px; }
        .btn-main.ready { background: var(--blue); color: white; cursor: pointer; opacity: 1; box-shadow: 0 0 15px var(--blue); }

        #timer { margin-top: 15px; color: var(--blue); font-weight: bold; display: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo" style="font-weight:900; font-size:1.5rem;">VORTEX<span>.</span></div>
    <div style="color: #666; font-size: 12px;">CREATED BY VORTEX</div>
</nav>

<div class="container">
    <div class="velocity-card">
        <img id="pImg" class="preview-img" src="">
        <h2 id="pName" style="margin-bottom: 20px;">Product Name</h2>

        <p style="font-size: 12px; color: #888; margin-bottom: 15px;">COMPLETE AS ETAPAS PARA LIBERAR:</p>
        
        <a href="http://www.youtube.com/@Vortex-Ofc1" target="_blank" class="step-btn yt-btn" id="ytBtn" onclick="checkStep('yt')">INSCREVER-SE NO CANAL</a>
        <a href="https://whatsapp.com/channel/0029VbC7FWcJENxsIOsndS15" target="_blank" class="step-btn wa-btn" id="waBtn" onclick="checkStep('wa')">ENTRAR NO WHATSAPP</a>

        <div id="timer">Liberando em <span id="sec">10</span>s...</div>
        
        <button id="mainBtn" class="btn-main" disabled onclick="finalDownload()">DOWNLOAD UNLOCKED</button>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('pName').innerText = params.get('n') || "Vortex File";
    document.getElementById('pImg').src = params.get('i') || "https://via.placeholder.com/350x180";

    let steps = { yt: false, wa: false };

    function checkStep(step) {
        steps[step] = true;
        document.getElementById(step + 'Btn').classList.add('done');
        
        if (steps.yt && steps.wa) {
            startCountdown();
        }
    }

    function startCountdown() {
        const timerDiv = document.getElementById('timer');
        const secSpan = document.getElementById('sec');
        const mainBtn = document.getElementById('mainBtn');
        let timeLeft = 10;

        timerDiv.style.display = 'block';

        const countdown = setInterval(() => {
            timeLeft--;
            secSpan.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDiv.innerText = "Link Liberado!";
                mainBtn.disabled = false;
                mainBtn.classList.add('ready');
            }
        }, 1000);
    }

    async function finalDownload() {
        const target = params.get('url');
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = "GENERATING TINYURL...";

        try {
            const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(target)}`);
            const short = await res.text();
            window.location.href = short;
        } catch {
            window.location.href = target;
        }
    }
</script>
</body>
</html>
