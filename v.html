<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX | Velocity Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; 
            --blue: #00a2ff; 
            --card: #111; 
            --glow: 0 0 20px rgba(0, 162, 255, 0.3); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: var(--bg); 
            color: white; 
            background-image: radial-gradient(circle at top, #0a1a2f 0%, #050505 100%); 
            min-height: 100vh; 
        }

        /* Navbar */
        nav { display: flex; justify-content: space-between; padding: 25px 8%; align-items: center; }
        .logo { font-weight: 900; font-size: 1.6rem; letter-spacing: 2px; }
        .logo span { color: var(--blue); text-shadow: var(--glow); }
        
        .tabs { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 12px; }
        .tab-btn { 
            background: none; border: none; color: #888; padding: 10px 20px; 
            cursor: pointer; font-weight: 600; border-radius: 8px; transition: 0.3s; 
        }
        .tab-btn.active { background: rgba(255,255,255,0.1); color: white; border-bottom: 2px solid var(--blue); }

        .btn-wa { background: #25D366; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }

        /* Conteúdo */
        .container { max-width: 500px; margin: 50px auto; padding: 0 20px; }
        
        .velocity-card { 
            background: var(--card); border: 1px solid #222; padding: 30px; 
            border-radius: 20px; text-align: center; box-shadow: var(--glow); 
            backdrop-filter: blur(10px); 
        }

        .preview-img { width: 100%; height: 200px; border-radius: 12px; object-fit: cover; margin-bottom: 20px; border: 1px solid #333; }
        
        h2 { margin-bottom: 10px; font-size: 1.5rem; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }

        .btn-action { 
            background: #fff; color: #000; border: none; width: 100%; padding: 15px; 
            border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.3s; 
        }
        .btn-action:hover { background: var(--blue); color: white; box-shadow: var(--glow); }

        .script-box { 
            background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; 
            font-family: monospace; color: var(--blue); word-break: break-all; text-align: left; margin-bottom: 15px; 
        }

        #loader { display: none; margin-top: 15px; color: var(--blue); font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

<nav>
    <div class="logo">VORTEX<span>.</span></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('download')">Unlock</button>
        <button class="tab-btn" onclick="changeTab('scripts')">Scripts</button>
        <button class="tab-btn" onclick="changeTab('credits')">Credits</button>
    </div>
    <a href="https://whatsapp.com/channel/0029VbC7FWcJENxsIOsndS15" target="_blank" class="btn-wa">WHATSAPP</a>
</nav>

<div class="container" id="content-area">
    </div>

<script>
    // Pegar dados da URL
    const params = new URLSearchParams(window.location.search);
    const pName = params.get('n') || "Vortex Product";
    const pImg = params.get('i') || "https://via.placeholder.com/400x200";
    const pUrl = params.get('url') || "https://google.com";

    function changeTab(tab) {
        const area = document.getElementById('content-area');
        
        // Atualizar botões
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase() === tab) btn.classList.add('active');
        });

        if(tab === 'download') {
            area.innerHTML = `
                <div class="velocity-card">
                    <img src="${pImg}" class="preview-img">
                    <h2>${pName}</h2>
                    <p>Clique abaixo para processar o link seguro e liberar o download.</p>
                    <button id="mainBtn" class="btn-action" onclick="startUnlock()">Unlock Content</button>
                    <div id="loader">Gerando link via TinyURL...</div>
                </div>`;
        } 
        else if(tab === 'scripts') {
            area.innerHTML = `
                <div class="velocity-card">
                    <h3>TinyURL API</h3>
                    <p>Use este script para seus projetos:</p>
                    <div class="script-box" id="code">fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(meuLink))</div>
                    <button class="btn-action" onclick="copyCode()">Copiar Script</button>
                </div>`;
        }
        else if(tab === 'credits') {
            area.innerHTML = `
                <div class="velocity-card">
                    <img src="https://i.imgur.com/your-vortex-logo.png" style="width:80px; border-radius:50%; border:2px solid var(--blue); margin-bottom:15px;">
                    <h3>Criado por VORTEX</h3>
                    <p>Desenvolvedor & Criador de Conteúdo</p>
                    <button class="btn-action" onclick="window.open('http://www.youtube.com/@Vortex-Ofc1')">Visitar Canal</button>
                </div>`;
        }
    }

    async function startUnlock() {
        const btn = document.getElementById('mainBtn');
        const loader = document.getElementById('loader');
        btn.style.display = 'none';
        loader.style.display = 'block';

        try {
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(pUrl)}`);
            const shortLink = await response.text();
            setTimeout(() => { window.location.href = shortLink; }, 2000);
        } catch (e) {
            window.location.href = pUrl;
        }
    }

    function copyCode() {
        const text = document.getElementById('code').innerText;
        navigator.clipboard.writeText(text);
        alert("Copiado!");
    }

    // Iniciar na aba de Download
    changeTab('download');
</script>

</body>
</html>
