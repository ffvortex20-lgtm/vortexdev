<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #111111;
            --accent-blue: #00a2ff;
            --text-main: #ffffff;
            --input-bg: #1a1a1a;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .admin-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(0, 162, 255, 0.1);
        }

        h2 { text-align: center; margin-bottom: 30px; font-weight: 800; }
        h2 span { color: var(--accent-blue); }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: #888; text-transform: uppercase; }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent-blue); }

        .btn-generate {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        .result-area {
            margin-top: 30px;
            padding: 15px;
            background: #000;
            border-radius: 8px;
            border: 1px dashed var(--accent-blue);
            display: none;
        }

        .result-area p { font-size: 0.8rem; color: var(--accent-blue); margin-bottom: 10px; }
        code { word-break: break-all; font-family: monospace; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>VELO<span>CITY</span> ADMIN</h2>
        
        <div class="form-group">
            <label>Nome do Produto</label>
            <input type="text" id="pName" placeholder="Ex: Roblox Script V3">
        </div>

        <div class="form-group">
            <label>Categoria</label>
            <select id="pCat">
                <option value="Software">Software</option>
                <option value="Tools">Tools</option>
                <option value="Scripts">Scripts</option>
            </select>
        </div>

        <div class="form-group">
            <label>URL da Imagem</label>
            <input type="text" id="pImg" placeholder="https://imgur.com/link-da-foto.png">
        </div>

        <div class="form-group">
            <label>Link de Download Real</label>
            <input type="text" id="pUrl" placeholder="https://mediafire.com/seu-arquivo">
        </div>

        <button class="btn-generate" onclick="generateJSON()">Gerar Código do Produto</button>

        <div id="result" class="result-area">
            <p>Copie e cole este objeto dentro da lista 'products' no seu index.html:</p>
            <code id="output"></code>
        </div>
    </div>

    <script>
        function generateJSON() {
            const name = document.getElementById('pName').value;
            const cat = document.getElementById('pCat').value;
            const img = document.getElementById('pImg').value;
            const url = document.getElementById('pUrl').value;

            if(!name || !url) return alert("Preencha o nome e o link!");

            // Gera o formato exato para copiar e colar
            const json = `{ name: "${name}", category: "${cat}", desc: "Clique para desbloquear o acesso.", img: "${img}", url: "${url}" },`;
            
            document.getElementById('output').innerText = json;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
